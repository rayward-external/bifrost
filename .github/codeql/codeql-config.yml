name: "CodeQL Config"

queries:
  - uses: security-and-quality

paths-ignore:
  - "examples/**"
  - "tests/**"
  - "**/*_test.go"
  - "core/internal/llmtests/**"

# IMPORTANT: query-filters match on query METADATA only (id, tags, severity,
# precision). A `paths:` key under `exclude:` is NOT a valid filter property —
# CodeQL silently ignores it AND the exclude then stops matching, so the alert
# reappears (verified empirically; see rayward-external/new-api). File scoping
# is only possible via the top-level `paths-ignore` above. The excludes below
# are therefore rule-level. Each was audited to fire ONLY on confirmed
# false-positive sites repo-wide, so a rule-level exclude has the same blast
# radius as the audited FP set. RE-AUDIT THESE ON EVERY UPSTREAM SYNC: if a
# future change adds a genuine vulnerability matching one of these rules, this
# config would hide it.
query-filters:
  # go/incorrect-integer-conversion: int32() casts for protobuf fields in all
  # provider adapters. By design — protobuf int32 maps to Go int32; token/count
  # values are never user-supplied and stay within int32 range.
  - exclude:
      id: go/incorrect-integer-conversion

  # go/clear-text-logging (3 high): field-insensitive model of BifrostContext's
  # generic value map — an API key stored into the context map taints every
  # value later read from it (request id, model, client name). The flagged log
  # sites emit only those non-sensitive identifiers (and sanitize the request id
  # via SanitizeLogValue); the key itself is never logged. Audited sites:
  # core/bifrost.go, core/mcp/utils.go, plugins/logging/main.go.
  - exclude:
      id: go/clear-text-logging

  # go/request-forgery (2 critical): every flagged client request targets either
  # an operator-configured provider endpoint (azure realtime, key config) or a
  # URL already guarded by bifrost.ValidateExternalURL (scheme + SSRF/IP checks).
  # CodeQL does not model ValidateExternalURL as a sanitizer. No untrusted host
  # flow exists. Same FP class suppressed in new-api.
  - exclude:
      id: go/request-forgery

  # go/path-injection (1 high): os.Stat on a file:// path from the authenticated
  # admin config API (PricingURL/ModelParametersURL). Operator-only trust
  # boundary — admins already have deploy/filesystem access. Keep the config API
  # admin-only for this to hold.
  - exclude:
      id: go/path-injection

  # go/log-injection (medium): request identifiers (model, request id, client
  # name, configured URLs) reach log sites; the gateway sanitizes user-facing
  # values via SanitizeLogValue/sanitizeLogValue at the sinks and the flagged
  # values are non-sensitive operator/identifier strings (OTEL/Prometheus
  # endpoints are operator config — see .github/fork-patches.txt). Logging
  # hygiene, not an injection vulnerability.
  - exclude:
      id: go/log-injection

  # go/useless-assignment-to-field / -to-local (warning): code-quality style
  # findings in vendored upstream Go, not vulnerabilities. Fixing upstream code
  # to satisfy them would break the keep-the-fork-vanilla rule.
  - exclude:
      id: go/useless-assignment-to-field
  - exclude:
      id: go/useless-assignment-to-local

  # go/comparison-of-identical-expressions (warning): fires on one upstream site
  # in handlers/governance.go. All sort.Slice comparators were verified to use
  # distinct i/j operands (no copy-paste bug), so the remaining match is an
  # intentional self-comparison (idiomatic float/NaN-style check). Quality
  # warning, not a vulnerability.
  - exclude:
      id: go/comparison-of-identical-expressions

  # go/weak-sensitive-data-hashing (2 high): framework/encrypt/encrypt.go:HashSHA256
  # uses SHA-256 for deterministic lookup-index hashes on virtual keys and session
  # tokens — NOT for password storage. The function comment documents this. CodeQL
  # does not model the distinction between password hashing and lookup hashing.
  # Audited: only this one site matches the rule repo-wide; no user password is
  # ever hashed with SHA-256.
  - exclude:
      id: go/weak-sensitive-data-hashing

  # go/duplicate-if-branches / go/duplicate-branches (warnings): identical
  # else-if/else branches in core/providers/bedrock/{responses,utils}.go for
  # extended-thinking config. Both branches set reasoningConfig/thinking to
  # "disabled"; the IsNovaModelFamily guard is scaffolding for future
  # provider-specific handling. Upstream code — changing it would break the
  # keep-the-fork-vanilla rule. (security-extended/-and-quality emit these
  # under the go/duplicate-branches id; the older alias is kept too.)
  - exclude:
      id: go/duplicate-if-branches
  - exclude:
      id: go/duplicate-branches

  # go/impossible-interface-nil-check (1 warning): core/providers/bedrock/invoke.go
  # contains an `if event == nil` guard after a switch that already returns on every
  # case; the nil branch is dead code. Upstream code — removing it would add
  # unnecessary divergence from upstream. Quality warning, not a vulnerability.
  - exclude:
      id: go/impossible-interface-nil-check

  # go/command-injection (critical FP): all exec.Command / exec.CommandContext calls
  # in this repo use operator-configured binaries or system-resolved paths (exec.LookPath).
  # Specifically: framework/postgresconn RunPasswordCommand uses PasswordCommandConfig
  # (from the startup JSON config file, not from HTTP input); skills_serving.go uses
  # exec.LookPath("git") resolved at init(); cli/ uses binaries from operator config.
  # No HTTP taint source reaches any exec.Command argument. The validatePasswordCommand
  # guard blocks shell interpreters; the exec.LookPath guard ensures git is a real binary.
  # CodeQL does not model these patterns as sanitizers. RE-AUDIT on every upstream sync.
  - exclude:
      id: go/command-injection

  # go/sql-injection (critical FP): all GORM .Order() calls that accept caller-supplied
  # sort fields go through double-layer validation — (1) HTTP-layer allowlist check in
  # parseSkillSortParams (rejects any unknown value before it reaches the store), and (2)
  # exhaustive switch-case in skillListOrder / skillVersionListOrder that returns ONLY
  # string literals for every branch (no concatenation of the caller-supplied value).
  # All other GORM queries (Where/Select/Pluck/Find/First) use parameterized ? placeholders.
  # CodeQL's conservative inter-procedural taint model does not recognize the allowlist-switch
  # pattern as a sanitizer: it traces HTTP query params through the struct fields into the
  # switch discriminant and conservatively marks the function's return as tainted.
  # Audited: every .Order() call with a non-literal argument is in skills.go (skillListOrder /
  # skillVersionListOrder) and is protected by the patterns above. No raw string interpolation
  # in SQL exists beyond rdb.go's sanitizeDimColumn/fmt.Sprintf path (operator-internal, not
  # HTTP-tainted). RE-AUDIT on every upstream sync: if a new .Order() call passes unsanitized
  # user input, this rule-level exclude would hide it.
  - exclude:
      id: go/sql-injection
