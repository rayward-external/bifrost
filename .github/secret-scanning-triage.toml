# Fork-only. Secret-scanning alerts confirmed to be test fixtures or
# placeholders, applied to GitHub by .github/workflows/security-alert-sync.yml
# (.github/scripts/sync_secret_scanning_alerts.py), which is the ONLY writer.
#
# One [[alerts]] entry per alert, judged individually by reading the flagged
# line. Never add a real-looking secret here: those are reported and rotated,
# then resolved as revoked by a person. Never paths-ignore a directory instead.
#
#   [[alerts]]
#   number = 0                  # the alert number on the Security tab
#   path = "tests/..."          # a path among the alert's locations (checked)
#   resolution = "used_in_tests"  # or "false_positive"
#   reason = "why this is a fixture, e.g. host db.internal in an error-text test"
#
# Removing an entry reopens the alert. An alert GitHub reports as validity
# "active" is never resolved from here.

