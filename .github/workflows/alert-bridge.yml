name: Alert Bridge
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options:
          - list
          - dismiss
      dismissals:
        required: false
        default: '[]'
        description: 'JSON array of {number,reason,comment}'

permissions:
  security-events: write
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List alerts
        if: inputs.mode == 'list'
        run: |
          gh api --paginate "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" > alerts.json
          echo "Open code-scanning alerts: $(jq length alerts.json)" >> $GITHUB_STEP_SUMMARY
          jq -c '[.[] | {number, rule: .rule.id, severity: .rule.security_severity_level, path: .most_recent_instance.location.path, line: .most_recent_instance.location.start_line}]' alerts.json

          gh api --paginate "repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" > dependabot-alerts.json
          echo "Open dependabot alerts: $(jq length dependabot-alerts.json)" >> $GITHUB_STEP_SUMMARY
          jq -c '[.[] | {number, package: .dependency.package.name, ecosystem: .dependency.package.ecosystem, severity: .security_advisory.severity, ghsa: .security_advisory.ghsa_id, vulnerable_range: .security_vulnerability.vulnerable_version_range, patched: .security_vulnerability.first_patched_version.identifier, manifest: .dependency.manifest_path}]' dependabot-alerts.json

      - name: Upload alerts artifact
        if: inputs.mode == 'list'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alerts
          path: alerts.json

      - name: Dismiss alerts
        if: inputs.mode == 'dismiss'
        run: |
          echo '${{ inputs.dismissals }}' | jq -c '.[]' | while read d; do
            n=$(jq -r .number <<<"$d")
            r=$(jq -r .reason <<<"$d")
            c=$(jq -r .comment <<<"$d")
            gh api -X PATCH "repos/${{ github.repository }}/code-scanning/alerts/$n" \
              -f state=dismissed \
              -f dismissed_reason="$r" \
              -f dismissed_comment="$c" \
              && echo "dismissed #$n ($r)" >> $GITHUB_STEP_SUMMARY
          done
