name: Debug PR Alerts (temp)
on:
  workflow_dispatch:
permissions:
  security-events: read
jobs:
  list:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List open alerts on PR branch
        run: |
          echo "=== Open code-scanning alerts on chore/sync-upstream-2026-06-16 ==="
          gh api "repos/${{ github.repository }}/code-scanning/alerts?state=open&ref=chore/sync-upstream-2026-06-16&per_page=100&tool_name=CodeQL" \
            | jq -r '.[] | "[\(.rule.id)] \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) - \(.rule.description)"'
          echo "=== Open alerts on main ==="
          gh api "repos/${{ github.repository }}/code-scanning/alerts?state=open&ref=main&per_page=100&tool_name=CodeQL" \
            | jq -r '.[] | "[\(.rule.id)] \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) - \(.rule.description)"'
