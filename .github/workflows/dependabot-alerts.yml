name: Dependabot Alerts to Issues

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly on Monday at 9am UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Create issues from Dependabot alerts
        env:
          # The default GITHUB_TOKEN cannot read the Dependabot alerts API (no
          # `permissions:` key grants that scope). Set a repo secret
          # DEPENDABOT_ALERTS_TOKEN (fine-grained PAT with Dependabot alerts:
          # read) to enable this job; until then it reports the gap instead of
          # failing outright.
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! alerts=$(gh api repos/${{ github.repository }}/dependabot/alerts \
            --jq '[.[] | select(.state == "open")]' 2>err.log); then
            echo "::warning::Could not read Dependabot alerts ($(cat err.log)). Add a DEPENDABOT_ALERTS_TOKEN repo secret (fine-grained PAT with 'Dependabot alerts: read') to enable this workflow."
            echo "Dependabot alerts sync skipped: missing DEPENDABOT_ALERTS_TOKEN secret or insufficient token scope." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$alerts" | jq -c '.[]' | while read -r alert; do
            pkg=$(echo "$alert" | jq -r '.dependency.package.name')
            number=$(echo "$alert" | jq -r '.number')
            severity=$(echo "$alert" | jq -r '.security_advisory.severity')
            summary=$(echo "$alert" | jq -r '.security_advisory.summary')
            url=$(echo "$alert" | jq -r '.html_url')
            ecosystem=$(echo "$alert" | jq -r '.dependency.package.ecosystem')

            # Skip if issue already exists for this alert
            existing=$(gh issue list \
              --repo "${{ github.repository }}" \
              --search "Dependabot Alert #${number}" \
              --json number --jq 'length')

            if [ "$existing" = "0" ]; then
              gh issue create \
                --repo "${{ github.repository }}" \
                --title "dep: update ${pkg} (${severity})" \
                --label "dependencies" \
                --body "$(cat <<EOF
          ## Dependabot Alert #${number}

          **Package:** \`${pkg}\`
          **Ecosystem:** ${ecosystem}
          **Severity:** ${severity}

          ${summary}

          [View Alert](${url})
          EOF
              )"
            fi
          done
