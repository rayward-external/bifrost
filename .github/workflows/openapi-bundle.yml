name: OpenAPI Bundle

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/openapi-bundle.yml"
      - "docs/openapi/**"
      - "!docs/openapi/openapi.json"

permissions:
  contents: read

jobs:
  bundle-openapi:
    name: Bundle OpenAPI Spec
    if: github.repository == 'maximhq/bifrost'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Bundle OpenAPI spec
        working-directory: ./docs/openapi
        run: python bundle.py

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          CURRENT_BRANCH="${GITHUB_REF_NAME:-main}"

          git add docs/openapi/openapi.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate openapi.json --skip-ci"
          git push origin "$CURRENT_BRANCH"
