# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: Scorecard supply-chain security
on:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: '20 7 * * 2'
  push:
    branches: ["main"]

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      contents: read
      actions: read
      # To allow GraphQL ListCommits to work
      issues: read
      pull-requests: read
      # To detect SAST tools
      checks: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            github.com:443
            index.docker.io:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443

      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) "write" PAT token. Uncomment the `repo_token` line below if:
          # - you want to enable the Branch-Protection check on a *public* repository, or
          # - you are installing Scorecards on a *private* repository
          # To create the PAT, follow the steps in https://github.com/ossf/scorecard-action#authentication-with-pat.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

          # Keep SARIF generation/upload local to GitHub code scanning. Publishing
          # to the OpenSSF webapp requires the job to contain only `uses` steps,
          # but this fork filters SARIF before upload.
          publish_results: false

      - name: "Filter fork-inapplicable findings"
        run: |
          sudo chown "$(id -u):$(id -g)" results.sarif
          python3 - <<'PY'
          import json
          from pathlib import Path

          sarif_path = Path("results.sarif")
          sarif = json.loads(sarif_path.read_text())
          drop_rule_ids = {
              "CIIBestPracticesID",
              "CodeReviewID",
              "MaintainedID",
          }
          removed = 0

          for run in sarif.get("runs", []):
              results = run.get("results", [])
              filtered_results = [
                  result
                  for result in results
                  if result.get("ruleId") not in drop_rule_ids
              ]
              removed += len(results) - len(filtered_results)
              run["results"] = filtered_results

              driver = run.get("tool", {}).get("driver", {})
              rules = driver.get("rules")
              if rules is None:
                  continue
              used_rule_ids = {
                  result.get("ruleId")
                  for result in filtered_results
                  if result.get("ruleId")
              }
              driver["rules"] = [
                  rule
                  for rule in rules
                  if rule.get("id") not in drop_rule_ids or rule.get("id") in used_rule_ids
              ]

          sarif_path.write_text(json.dumps(sarif, indent=2) + "\n")
          print(f"Removed {removed} fork-inapplicable Scorecard findings from code-scanning SARIF.")
          PY

      # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
      # format to the repository Actions tab.
      - name: "Upload artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard.
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        with:
          sarif_file: results.sarif
