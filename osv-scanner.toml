# Fork-only. Dependency advisories this fork has triaged as unfixable for us,
# each with a reason and an expiry (osv-scanner config format). The daily
# security sweep is the only author; .github/workflows/security-alert-sync.yml
# mirrors every unexpired entry onto the matching Dependabot alert (dismissed
# as tolerable_risk) and reopens it when the entry is removed or expires.
#
# Add an entry only for an advisory the shipped artifact does not install or
# reach, with an expiry no more than 90 days out:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"      # or GO-/CVE- id; aliases are resolved
#   ignoreUntil = 2027-01-01
#   reason = "why it is unfixable AND why the shipped image does not reach it"

[[IgnoredVulns]]
id = "GO-2026-6911"
ignoreUntil = 2027-02-01
reason = "SSRF/credential-leak via unvalidated Location header in github.com/mark3labs/mcp-go. No patched release exists anywhere in the dependency graph (govulncheck: Fixed in N/A), including the maximhq/mcp-go fork core/framework/transports/plugins/* replace it with. osv-scanner's IgnoredVulns matches by ID repo-wide, so this one entry covers every go.mod requiring it. Reachability per module, re-checked 2026-11-10: (1) examples/mcps/apps-server and examples/mcps/input-required-server import only mcp-go/server, never mcp-go/client -- the vulnerable client-redirect code path does not exist in these binaries. (2) examples/mcps/per-user-discovery-server and tests/cmd/mcpconsole (chaosmock/sdkclient.go) do call mcp-go/client/transport in test-only code, same as the already-tracked residual from 2026-11-08 (tests/cmd/mcpconsole fork-patches.txt row) -- real at the dependency level but never shipped (SHIPPED_RESOLUTION: transports/Dockerfile.custom builds only core/framework/plugins/transports + the ui/ static export; examples/ and tests/ never ship). (3) core/mcp/clientmanager.go is the only shipped call site (buildTLSHTTPClientWithProxyAndResolver, used by all 3 of its transport.NewStreamableHTTP/client construction paths) and IS reachable -- this PR closes the actual exploit (denyCrossHostMCPRedirect, a CheckRedirect policy refusing any redirect that changes host, added to every http.Client that path returns) rather than relying on non-reachability; see core/mcp/clientmanager_test.go's TestDenyCrossHostMCPRedirect / TestBuildTLSHTTPClientRefusesCrossHostRedirect. The underlying library defect is unpatched, so the advisory stays open against the dependency itself until mark3labs/mcp-go (or the fork) ships a fix; re-check at expiry."
